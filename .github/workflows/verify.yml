name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 工具链
        run: python -m pip install --upgrade pip setuptools wheel
      - name: 测试
        run: python -m unittest discover -s tests -t . -v
        env:
          PYTHONUTF8: "1"
      - name: 安装并冒烟
        run: |
          pip install .
          spdiff --version
      - name: 黄金样例退出码
        shell: bash
        run: |
          check() {
            rc=0
            spdiff "$1" "$2" > /dev/null 2>&1 || rc=$?
            echo "$3 rc=$rc (期望 $4)"
            test "$rc" = "$4"
          }
          check examples/pair_a_before.sp examples/pair_a_after.sp pair_a 0
          check examples/pair_b_before.sp examples/pair_b_after.sp pair_b 1
          check examples/pair_c_before.sp examples/pair_c_after.sp pair_c 1
          check examples/pair_d_before.sp examples/pair_d_after.sp pair_d 2
          check examples/error_bad_syntax.sp examples/pair_a_before.sp error 3
      - name: 输出确定性
        shell: bash
        run: |
          spdiff examples/pair_b_before.sp examples/pair_b_after.sp > run1.txt
          spdiff examples/pair_b_before.sp examples/pair_b_after.sp > run2.txt
          cmp run1.txt run2.txt
          echo "两次运行字节一致"
